{% extends "base.html" %}
{% block title %}新增學生資料｜學生資料管理系統{% endblock %}

{% block content %}
<section class="page-header">
    <div>
        <h1>新增學生資料</h1>
        <p class="page-description">填寫以下欄位以建立新的學生資料。</p>
    </div>
    <div class="page-actions">
        <a class="button button-secondary" href="{% url 'index' %}">回到首頁</a>
    </div>
</section>

<form class="card form-card" action="{% url 'post' %}" method="POST">
    {% csrf_token %}
    <table class="form-table">
        <tbody>
            <tr>
                <th><label for="cname">*姓名</label></th>
                <td><input type="text" id="cname" name="cname" required placeholder="請輸入姓名"></td>
            </tr>
            <tr>
                <th>性別</th>
                <td>
                    <label for="csex_m"><input type="radio" id="csex_m" name="csex" value="M" checked>男</label>
                    <label for="csex_f"><input type="radio" id="csex_f" name="csex" value="F">女</label>
                </td>
            </tr>
            <tr>
                <th><label for="cbirthday">*生日</label></th>
                <td><input type="date" id="cbirthday" name="cbirthday" required></td>
            </tr>
            <tr>
                <th><label for="cemail">*信箱</label></th>
                <td><input type="email" id="cemail" name="cemail" required placeholder="請輸入電子郵件"></td>
            </tr>
            <tr>
                <th><label for="cphone">電話</label></th>
                <td><input type="text" id="cphone" name="cphone"></td>
            </tr>
            <tr>
                <th><label for="caddr">地址</label></th>
                <td><input type="text" id="caddr" name="caddr"></td>
            </tr>
            <tr>
                <td class="actions-cell" colspan="2">
                    <div class="button-row form-actions">
                        <input type="reset" value="清除">
                        <input type="submit" value="儲存資料">
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</form>
{% endblock %}
